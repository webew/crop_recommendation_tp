[project]
name = "crop-recommendation-tp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "webew", email = "fillion.bertrand@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dvc>=3.67.1",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.2",
    "pandas>=3.1.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
]

[project.scripts]
crop-recommendation-tp = "crop_recommendation_tp:main"
train = "crop_recommendation_tp.train:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.5",
]
