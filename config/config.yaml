dataset:
    path: data/raw/crop_recommendation.csv
    schema: config/schema.yaml
    target: label
split:
    test_size: 0.2
    random_seed: 42
mlflow:
    tracking_uri: sqlite:///mlflow.db
    experiment_name: crop-recommendation
model:
    params:
        n_estimators: 100
tuning:
    cv_folds: 5
    scoring: f1_macro
    param_grid:
        n_estimators: [50, 100, 200]
        max_depth: [3, 5, 10, null]
