name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v10.3.3 # pas de tag majeur (v10) publié depuis v8
            - run: uv sync --locked
            - run: uv run pytest
